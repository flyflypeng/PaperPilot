version: "3.8"

services:
  paperpilot:
    image: ghcr.io/flyflypeng/paperpilot:latest
    container_name: paperpilot
    ports:
      - "7191:7191"
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - ARXIV_PROXY=${ARXIV_PROXY}
      - ARXIV_API_PROXY=${ARXIV_API_PROXY}
      - ARXIV_HTTP_PROXY=${ARXIV_HTTP_PROXY}
      - ARXIV_HTTPS_PROXY=${ARXIV_HTTPS_PROXY}
    volumes:
      # Runtime env file loaded by python-dotenv inside the container
      - ./.env:/app/.env:ro
      # SQLite database and app-managed metadata
      - ./data/db:/app/db
      # Uploaded papers and generated artifacts
      - ./data/papers:/data/papers
    restart: unless-stopped
